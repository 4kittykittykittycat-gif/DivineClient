# nginx config for the DivineSMP web client + relay (use this OR Caddy, not both).
# Get a certificate first, e.g.:  sudo certbot --nginx -d client.divinesmp.org
server {
    listen 443 ssl http2;
    server_name client.divinesmp.org;
    ssl_certificate     /etc/letsencrypt/live/client.divinesmp.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/client.divinesmp.org/privkey.pem;

    root /var/www/divinesmp-web;
    index index.html;
    gzip on;
    gzip_types text/html application/javascript application/json application/manifest+json;

    location = /index.html       { add_header Cache-Control "no-cache"; }
    location = /sw.js            { add_header Cache-Control "no-cache"; }
    location = /version.json     { add_header Cache-Control "no-cache"; }

    # the relay
    location /wisp/ {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        tcp_nodelay on;
    }
}
server {
    listen 80;
    server_name client.divinesmp.org;
    return 301 https://$host$request_uri;
}
